<style>
/* Layout: noche de estadio. Cabecera con clubes como solapas, "la baja del día" en grande, grilla de camisetas con la foto sobre fondo claro. */
:root {
  --bg: #0B0E12;
  --surface: #131920;
  --surface-2: #1A222B;
  --line: #26303B;
  --ink: #F4F4F0;
  --muted: #98A2AD;
  --accent: #C6F24E;           /* verde luz de estadio: precio y acción */
  --accent-ink: #0B0E12;
  --photo: #E7EAEE;            /* fondo claro para las fotos de producto */
  --display: "Saira Extra Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  font-size: 16px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabecera */
.cab { border-bottom: 1px solid var(--line); }
.cab .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 16px 0; }
.logo {
  font-family: var(--display); font-weight: 900; font-size: 34px; letter-spacing: 1px;
  text-transform: uppercase; text-decoration: none; line-height: 1; padding-bottom: 14px;
}
.clubes { display: flex; gap: 2px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
.clubes::-webkit-scrollbar { display: none; }
.solapa {
  flex: none; background: none; border: 0; cursor: pointer; color: var(--muted);
  font-weight: 600; font-size: 15px; padding: 10px 14px 13px; border-bottom: 3px solid transparent;
}
.solapa:hover { color: var(--ink); }
.solapa[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--color, var(--ink)); }
.yo { display: flex; gap: 10px; align-items: center; padding-bottom: 12px; }
.yo label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
select, input[type="search"] {
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; font-weight: 600; font-size: 15px;
}

/* Destacada */
.destacada .wrap { display: flex; flex-wrap: wrap; gap: 32px; padding-block: 36px; align-items: stretch; }
.d-txt { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.eyebrow { font-weight: 700; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.d-titulo {
  margin: 0; font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(52px, 8.6vw, 104px); line-height: 0.86; letter-spacing: 0.3px; text-wrap: balance;
}
.d-bajada { margin: 0; font-size: 18px; color: #C9CFD6; max-width: 48ch; }
.d-precio { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 24px; }
.big {
  font-family: var(--display); font-weight: 800; font-size: clamp(60px, 8vw, 88px); line-height: 0.85;
  font-variant-numeric: tabular-nums;
}
.chico { font-size: 15px; color: var(--muted); }
.cta {
  display: inline-block; text-decoration: none; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 17px; padding: 14px 22px; border-radius: 6px;
}
.cta:hover { filter: brightness(1.08); }
.d-foto {
  flex: 1 1 400px; min-width: 0; min-height: 400px; border-radius: 4px; position: relative; overflow: hidden;
  background: var(--club, #2A3139); display: grid; place-items: center;
}
.d-foto .disco {
  width: min(82%, 420px); aspect-ratio: 1; border-radius: 50%; background: var(--photo);
  display: grid; place-items: center; overflow: hidden; position: relative; z-index: 1;
}
.d-foto img { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
.d-foto .disco svg { width: 62%; height: auto; }
.d-foto .dorsal {
  position: absolute; right: -12px; bottom: -48px; font-family: var(--display); font-weight: 900;
  font-size: 340px; line-height: 1; color: rgba(0,0,0,0.18);
}

/* Barra de búsqueda y orden */
.barra .wrap {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  border-top: 1px solid var(--line); padding-block: 18px;
}
.barra h2 { margin: 0 auto 0 0; font-family: var(--display); font-weight: 800; font-size: 40px; text-transform: uppercase; line-height: 1; }
.barra input[type="search"] { width: min(100%, 260px); }
.barra label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.cuenta { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Grilla */
main .wrap { padding-block: 4px 56px; }
.grilla { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.ficha { background: var(--surface); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.f-foto {
  background: var(--photo); height: 250px; position: relative; display: grid; place-items: center;
  border-top: 5px solid var(--club, #2A3139);
}
.f-foto img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; padding: 10px; }
.f-foto svg { width: 58%; height: auto; }
.badge {
  position: absolute; top: 12px; left: 12px; background: var(--accent); color: var(--accent-ink);
  font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.15; padding: 0 10px; border-radius: 3px;
}
.f-cuerpo { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.club { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.nombre { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 600; color: #C9CFD6; border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; }
.tag.jug { border-color: var(--accent); color: var(--accent); }
.f-precio { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: auto; }
.mid { font-family: var(--display); font-weight: 800; font-size: 50px; line-height: 0.88; font-variant-numeric: tabular-nums; }
.ahorro { font-size: 14px; color: var(--accent); font-weight: 600; }
.ahorro.igual { color: var(--muted); font-weight: 500; }
details.tiendas { border-top: 1px solid var(--line); }
details.tiendas summary {
  list-style: none; cursor: pointer; padding: 12px 18px; font-weight: 600; font-size: 15px;
  display: flex; justify-content: space-between; align-items: center;
}
details.tiendas summary::-webkit-details-marker { display: none; }
details.tiendas summary::after { content: "+"; font-size: 20px; color: var(--muted); }
details.tiendas[open] summary::after { content: "−"; }
.lista { list-style: none; margin: 0; padding: 0 18px 12px; }
.lista li {
  display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px;
}
.lista .tn { font-weight: 600; min-width: 0; }
.lista .tp { font-weight: 700; font-variant-numeric: tabular-nums; }
.lista .tp s { color: var(--muted); font-weight: 400; font-size: 13px; margin-right: 6px; }
.lista a {
  text-decoration: none; font-weight: 700; font-size: 13px; padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 5px;
}
.lista a:hover { border-color: var(--accent); color: var(--accent); }
.lista .tt { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.lista .tt b { color: var(--ink); }
.lista li.mejor .tn::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); margin-right: 8px; vertical-align: 1px;
}
.lista li.fuera { opacity: 0.5; }
.vacio { text-align: center; color: var(--muted); padding: 64px 16px; }
.vacio b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

footer .wrap { border-top: 1px solid var(--line); padding-block: 22px 48px; color: var(--muted); font-size: 13.5px; }
footer p { margin: 0 0 6px; max-width: 80ch; }

@media (max-width: 700px) {
  .cab .wrap { gap: 8px 16px; }
  .yo { width: 100%; }
  .d-foto { min-height: 300px; }
  .d-foto .dorsal { font-size: 220px; }
  .barra h2 { font-size: 32px; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .ficha { transition: transform .15s ease; }
  .ficha:hover { transform: translateY(-2px); }
}
</style>

<script>
(function () {
  const D = window.VITRINA;
  const $ = (id) => document.getElementById(id);
  if (!D) { $("vacio").hidden = false; return; }

  const ADULTO = ["XS", "S", "M", "L", "XL", "2XL", "3XL", "4XL"];
  const NINO = ["4", "6", "8", "10", "12", "14", "16"];
  const CLUBES = {
    todos: { n: "Todos", c: "#F4F4F0" },
    seleccion: { n: "Selección", c: "#75AADB", fondo: "#3E6E99", c1: "#75AADB", c2: "#FFFFFF", deco: "rayas" },
    independiente: { n: "Independiente", c: "#E0243F", fondo: "#9E0F25", c1: "#C8102E", c2: "#C8102E", deco: "lisa" },
    boca: { n: "Boca", c: "#F2B705", fondo: "#0B2A5B", c1: "#0B2A5B", c2: "#F2B705", deco: "franja" },
    river: { n: "River", c: "#E0243F", fondo: "#B30E26", c1: "#FFFFFF", c2: "#D0102B", deco: "banda" },
    racing: { n: "Racing", c: "#75AADB", fondo: "#3E6E99", c1: "#75AADB", c2: "#FFFFFF", deco: "rayas" },
    san_lorenzo: { n: "San Lorenzo", c: "#C8102E", fondo: "#0B2A5B", c1: "#0B2A5B", c2: "#C8102E", deco: "rayas" }
  };
  const TIPOS = { titular: "Titular", alternativa: "Alternativa", tercera: "Tercera", arquero: "Arquero",
                  retro: "Retro", entrenamiento: "Entrenamiento", otra: "Especial" };
  const plata = (n) => "$" + Math.round(n).toLocaleString("es-AR");
  const tienda = (t) => D.tiendas[t] || t;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- estado: hash (compartible) > guardado > por defecto ----------
  const estado = { club: "todos", publico: "hombre", talle: "", temporada: "todas", orden: "ahorro", q: "" };
  try { Object.assign(estado, JSON.parse(localStorage.getItem("vestuario") || "{}")); } catch (e) {}
  leerHash();

  function leerHash() {
    // #boca-hombre-m  ·  #todos-nino-10  ·  #river
    const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if (!h) return;
    const [club, publico, talle] = h.split("-");
    if (CLUBES[club] || club === "san") estado.club = club === "san" ? "san_lorenzo" : club;
    if (["hombre", "mujer", "nino"].includes(publico)) estado.publico = publico;
    estado.talle = talle ? talle.toUpperCase() : (publico ? "" : estado.talle);
  }
  function escribirHash() {
    const partes = [estado.club === "san_lorenzo" ? "sanlorenzo" : estado.club, estado.publico];
    if (estado.talle) partes.push(estado.talle.toLowerCase());
    const h = "#" + partes.join("-");
    if (location.hash !== h) history.replaceState(null, "", h);
    try { localStorage.setItem("vestuario", JSON.stringify(estado)); } catch (e) {}
  }
  window.addEventListener("hashchange", () => { leerHash(); pintarControles(); pintar(); });

  const publicoDato = (p) => p === "nino" ? "niño" : p;

  // ---------- controles ----------
  function pintarControles() {
    const presentes = Object.keys(CLUBES).filter(c => c === "todos" || D.items.some(i => i.club === c));
    $("clubes").innerHTML = presentes.map(c =>
      `<button type="button" class="solapa" data-club="${c}" style="--color:${CLUBES[c].c}" aria-pressed="${estado.club === c}">${CLUBES[c].n}</button>`
    ).join("");
    $("clubes").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      estado.club = b.dataset.club; escribirHash(); pintarControles(); pintar();
    }));
    $("f-publico").value = estado.publico;
    const lista = estado.publico === "nino" ? NINO : ADULTO;
    const hay = new Set(D.items.filter(i => i.publico === publicoDato(estado.publico)).flatMap(i => i.ofertas.flatMap(o => o.talles)));
    const opciones = lista.filter(t => hay.has(t));
    if (estado.talle && !opciones.includes(estado.talle)) estado.talle = "";
    $("f-talle").innerHTML = `<option value="">Cualquiera</option>` + opciones.map(t => `<option value="${t}">${t}</option>`).join("");
    $("f-talle").value = estado.talle;
    $("f-temporada").value = estado.temporada;
    $("f-orden").value = estado.orden;
    $("f-buscar").value = estado.q;
  }
  $("f-publico").addEventListener("change", e => { estado.publico = e.target.value; estado.talle = ""; escribirHash(); pintarControles(); pintar(); });
  $("f-talle").addEventListener("change", e => { estado.talle = e.target.value; escribirHash(); pintar(); });
  $("f-temporada").addEventListener("change", e => { estado.temporada = e.target.value; escribirHash(); pintar(); });
  $("f-orden").addEventListener("change", e => { estado.orden = e.target.value; escribirHash(); pintar(); });
  $("f-buscar").addEventListener("input", e => { estado.q = e.target.value; pintar(); });

  // ---------- lógica ----------
  const esActual = (i) => /26\s?\/\s?27|2026\/27/.test(i.temporada + " " + i.nombre) ||
    (i.temporada === "2026" && !/25\s?26|2025/.test(i.nombre));
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  function vista() {
    const q = norm(estado.q.trim());
    const out = [];
    for (const it of D.items) {
      if (estado.club !== "todos" && it.club !== estado.club) continue;
      if (it.publico !== publicoDato(estado.publico)) continue;
      if (estado.temporada === "actual" && !esActual(it)) continue;
      if (estado.temporada === "anteriores" && esActual(it)) continue;
      if (q && !norm(`${it.nombre} ${it.temporada} ${TIPOS[it.tipo] || ""} ${CLUBES[it.club]?.n || ""}`).includes(q)) continue;
      const ofs = it.ofertas.map(o => {
        const sinDato = o.talles.length === 0;
        return { ...o, sinDato, tiene: !estado.talle || sinDato || o.talles.includes(estado.talle) };
      });
      const validas = ofs.filter(o => o.tiene);
      if (!validas.length) continue;
      const conf = validas.filter(o => !o.sinDato);
      const mejor = (conf.length ? conf : validas).reduce((a, b) => b.precio < a.precio ? b : a);
      const cara = validas.reduce((a, b) => b.precio > a.precio ? b : a);
      const ahorro = cara.precio - mejor.precio;
      const pct = cara.precio ? 100 * ahorro / cara.precio : 0;
      const pctLista = mejor.lista > mejor.precio ? 100 * (1 - mejor.precio / mejor.lista) : 0;
      out.push({ it, ofs, mejor, cara, ahorro, pct, pctLista });
    }
    const orden = {
      ahorro: (a, b) => b.ahorro - a.ahorro || a.mejor.precio - b.mejor.precio,
      precio: (a, b) => a.mejor.precio - b.mejor.precio,
      nuevas: (a, b) => (b.it.temporada || "").localeCompare(a.it.temporada || "") || a.mejor.precio - b.mejor.precio
    }[estado.orden];
    return out.sort(orden);
  }

  function camiseta(club) {
    const k = CLUBES[club] || { c1: "#9AA59F", c2: "#9AA59F", deco: "lisa" };
    const id = "c" + Math.random().toString(36).slice(2, 8);
    const forma = "M52 10 L68 18 Q80 26 92 18 L108 10 L148 30 L136 62 L120 56 L120 150 L40 150 L40 56 L24 62 L12 30 Z";
    let deco = "";
    if (k.deco === "franja") deco = `<rect x="10" y="62" width="140" height="22" fill="${k.c2}" clip-path="url(#${id})"/>`;
    if (k.deco === "banda") deco = `<polygon points="30,150 58,150 150,44 150,14" fill="${k.c2}" clip-path="url(#${id})"/>`;
    if (k.deco === "rayas") deco = [36, 68, 100].map(x => `<rect x="${x}" y="0" width="16" height="160" fill="${k.c2}" clip-path="url(#${id})"/>`).join("");
    return `<svg viewBox="0 0 160 160" aria-hidden="true"><defs><clipPath id="${id}"><path d="${forma}"/></clipPath></defs><path d="${forma}" fill="${k.c1}"/>${deco}<path d="${forma}" fill="none" stroke="#0B0E12" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
  }
  window.__camiseta = camiseta;
  const foto = (it) => it.imagen
    ? `<img src="${esc(it.imagen)}" alt="${esc(it.nombre)}" loading="lazy" onerror="this.outerHTML=window.__camiseta('${it.club}')">`
    : camiseta(it.club);

  function titular(v) {
    const club = CLUBES[v.it.club]?.n || "";
    const t = TIPOS[v.it.tipo] || "camiseta";
    const pct = Math.round(v.ahorro >= 1 ? v.pct : v.pctLista);
    if (pct >= 5) return `La ${t.toLowerCase()} de ${club}, ${pct}% abajo`;
    return `${club}: ${v.it.nombre}`;
  }

  function pintarDestacada(v) {
    const sec = $("destacada");
    if (!v) { sec.innerHTML = ""; return; }
    const k = CLUBES[v.it.club] || {};
    const otra = v.ahorro >= 1 ? ` En ${esc(tienda(v.mejor.tienda))} está ${plata(v.ahorro)} más barata que en ${esc(tienda(v.cara.tienda))}.` : "";
    const antes = v.ahorro >= 1 ? ` · en ${esc(tienda(v.cara.tienda))} ${plata(v.cara.precio)}`
      : (v.mejor.lista > v.mejor.precio + 1 ? ` · antes <s>${plata(v.mejor.lista)}</s>` : "");
    const temporada = (v.it.temporada.match(/\d{2}(?=\/|$)/) || [""])[0];
    sec.innerHTML = `<div class="wrap">
      <div class="d-txt">
        <span class="eyebrow">La baja del día · ${esc(k.n || "")}</span>
        <h1 class="d-titulo">${esc(titular(v))}</h1>
        <p class="d-bajada">${esc(v.it.nombre)}.${otra}${estado.talle ? ` Hay talle ${esc(estado.talle)}.` : ""}</p>
        <div class="d-precio">
          <div><div class="big">${plata(v.mejor.precio)}</div>
          <div class="chico">en ${esc(tienda(v.mejor.tienda))}${antes}</div></div>
          <a class="cta" href="${esc(v.mejor.url)}" target="_blank" rel="noopener">Ir a la tienda</a>
        </div>
      </div>
      <div class="d-foto" style="--club:${k.fondo || "#2A3139"}">
        <span class="dorsal" aria-hidden="true">${esc(temporada)}</span>
        <div class="disco">${foto(v.it)}</div>
      </div>
    </div>`;
  }

  function ficha(v) {
    const { it, ofs, mejor, cara, ahorro } = v;
    const k = CLUBES[it.club] || {};
    const pct = Math.round(ahorro >= 1 ? v.pct : v.pctLista);
    const tags = [
      it.temporada && `<span class="tag">${esc(it.temporada)}</span>`,
      `<span class="tag">${TIPOS[it.tipo] || "Especial"}</span>`,
      it.version === "jugador" && `<span class="tag jug">Versión jugador</span>`,
      it.manga === "larga" && `<span class="tag">Manga larga</span>`
    ].filter(Boolean).join("");
    const validas = ofs.filter(o => o.tiene);
    const ahorroTxt = ahorro >= 1
      ? `<span class="ahorro">${plata(ahorro)} menos que en ${esc(tienda(cara.tienda))}</span>`
      : `<span class="ahorro igual">${validas.length > 1 ? "Mismo precio en todas" : "Solo en " + esc(tienda(mejor.tienda))}</span>`;
    const filas = ofs.slice().sort((a, b) => (b.tiene - a.tiene) || a.precio - b.precio).map(o => {
      const tt = o.sinDato ? "Talles: consultar en la tienda"
        : "Talles: " + o.talles.map(t => t === estado.talle ? `<b>${t}</b>` : t).join(" · ");
      const s = o.lista > o.precio + 1 ? `<s>${plata(o.lista)}</s>` : "";
      const es = o.tienda === mejor.tienda && o.precio === mejor.precio;
      return `<li class="${es ? "mejor" : ""} ${o.tiene ? "" : "fuera"}">
        <span class="tn">${esc(tienda(o.tienda))}${o.tiene ? "" : " · sin tu talle"}</span>
        <span class="tp">${s}${plata(o.precio)}</span>
        <a href="${esc(o.url)}" target="_blank" rel="noopener">Ver</a>
        <span class="tt">${tt}</span></li>`;
    }).join("");
    return `<article class="ficha">
      <div class="f-foto" style="--club:${k.c || "#2A3139"}">${pct >= 5 ? `<span class="badge">−${pct}%</span>` : ""}${foto(it)}</div>
      <div class="f-cuerpo">
        <span class="club">${esc(k.n || it.club)} · ${esc(it.marca)}</span>
        <h3 class="nombre">${esc(it.nombre)}</h3>
        <div class="tags">${tags}</div>
        <div class="f-precio">
          <div><div class="mid">${plata(mejor.precio)}</div>
          <div class="chico">en ${esc(tienda(mejor.tienda))}${estado.talle ? " · talle " + esc(estado.talle) : ""}</div></div>
        </div>
        ${ahorroTxt}
      </div>
      <details class="tiendas"><summary>${ofs.length === 1 ? "Ver la tienda" : `Comparar ${ofs.length} tiendas`}</summary>
        <ul class="lista">${filas}</ul></details>
    </article>`;
  }

  function pintar() {
    const vs = vista();
    const destacada = vs.slice().sort((a, b) => b.ahorro - a.ahorro || b.pctLista - a.pctLista)[0];
    pintarDestacada(destacada && (destacada.ahorro > 0 || destacada.pctLista > 0) ? destacada : null);
    const resto = destacada ? vs.filter(v => v !== destacada) : vs;
    $("grilla").innerHTML = resto.map(ficha).join("");
    $("vacio").hidden = vs.length > 0;
    $("cuenta").textContent = `${vs.length} camiseta${vs.length === 1 ? "" : "s"}`;
    $("titulo-lista").textContent = estado.talle ? `Más bajas en talle ${estado.talle}` : "Más bajas";
  }

  // ---------- pie ----------
  const [a, m, d] = D.fecha.split("-");
  const tiendas = [...new Set(D.items.flatMap(i => i.ofertas.map(o => o.tienda)))].map(tienda);
  $("pie").innerHTML = `<p>Precios y talles de ${tiendas.join(", ")}, actualizados el ${d}/${m}/${a}. Solo camisetas oficiales con al menos un talle disponible.</p>
    <p>El precio es el publicado en cada tienda, sin promociones bancarias ni envío. Dexter y Stock Center son del mismo grupo y suelen tener el mismo precio.</p>`;

  pintarControles();
  pintar();
  escribirHash();
})();
</script>
